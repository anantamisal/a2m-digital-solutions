# =====================================================================
# A2M Digital Solutions - nginx configuration
#
# Serves the static marketing site (index.html) and the admin dashboard
# (admin.html), and proxies API calls to the FastAPI backend container.
#
# The single most important detail: proxy_pass has NO trailing slash and
# NO URI part, so nginx forwards the request path UNCHANGED.
#   /api/admin/login -> backend /api/admin/login
#   /admin/login     -> backend /admin/login
# If you ever add a trailing slash the prefix is stripped and every
# backend route 404s.
# =====================================================================

upstream a2m_backend {
    server backend:8000;
    keepalive 16;
}

# ---------------------------------------------------------------------
# :80 - ACME challenges stay on plain HTTP, everything else redirects
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name a2mdigitalsolutions.com www.a2mdigitalsolutions.com;

    # Let's Encrypt HTTP-01 validation must be reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# :443 - the live site
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name a2mdigitalsolutions.com www.a2mdigitalsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/a2mdigitalsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a2mdigitalsolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Recorded audio from the AI Agent is uploaded to /api/ai/transcribe.
    client_max_body_size 25m;

    # Common proxy headers, applied to every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # The NVIDIA/NIM calls can take up to NVIDIA_TIMEOUT seconds (90 by
    # default). Give nginx a little headroom over that, otherwise nginx
    # cuts the request off at exactly the same moment the backend answers.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ---- Static site ------------------------------------------------
    # admin.html and index.html are static files. Only the /api/* and
    # /admin/* calls they make are proxied.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /admin.html {
        try_files /admin.html =404;
    }

    # ---- API --------------------------------------------------------
    location /api/ {
        proxy_pass http://a2m_backend;
    }

    # ---- Legacy admin aliases ---------------------------------------
    # The backend keeps /admin/login, /admin/logout, /admin/stats and
    # /admin/inquiries as aliases of the /api/admin/* routes.
    location /admin/ {
        proxy_pass http://a2m_backend;
    }

    # ---- Backend utilities ------------------------------------------
    location = /health {
        proxy_pass http://a2m_backend/health;
    }

    location = /docs {
        proxy_pass http://a2m_backend/docs;
    }

    location = /redoc {
        proxy_pass http://a2m_backend/redoc;
    }

    location = /openapi.json {
        proxy_pass http://a2m_backend/openapi.json;
    }
}
