<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - A2M Digital Solutions</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }
        .admin-sidebar {
            background: var(--color-secondary);
            color: var(--color-white);
            padding: var(--spacing-6) var(--spacing-4);
        }
        .admin-logo {
            font-size: var(--font-size-xl);
            font-weight: 700;
            margin-bottom: var(--spacing-8);
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
        }
        .admin-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-2);
        }
        .admin-nav a {
            color: var(--color-gray-300);
            padding: var(--spacing-3) var(--spacing-4);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            text-decoration: none;
        }
        .admin-nav a:hover,
        .admin-nav a.active {
            background: var(--color-primary);
            color: var(--color-white);
        }
        .admin-main {
            padding: var(--spacing-8);
            background: var(--color-gray-50);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-8);
        }
        .admin-title {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--color-secondary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--spacing-6);
            margin-bottom: var(--spacing-8);
        }
        .stat-card {
            background: var(--color-white);
            padding: var(--spacing-6);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-gray-200);
        }
        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--color-gray-500);
            margin-bottom: var(--spacing-2);
        }
        .stat-value {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--color-secondary);
        }
        .stat-card.primary .stat-value { color: var(--color-primary); }
        .stat-card.success .stat-value { color: var(--color-success); }
        .stat-card.warning .stat-value { color: var(--color-warning); }
        .table-container {
            background: var(--color-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-gray-200);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: var(--spacing-4);
            text-align: left;
            border-bottom: 1px solid var(--color-gray-200);
        }
        th {
            background: var(--color-gray-50);
            font-weight: 600;
            color: var(--color-gray-700);
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr:hover td {
            background: var(--color-gray-50);
        }
        .badge {
            display: inline-block;
            padding: var(--spacing-1) var(--spacing-3);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 600;
            text-transform: capitalize;
        }
        .badge-new { background: var(--color-primary); color: var(--color-white); }
        .badge-contacted { background: var(--color-warning); color: var(--color-white); }
        .badge-closed { background: var(--color-success); color: var(--color-white); }
        .pagination {
            display: flex;
            justify-content: center;
            gap: var(--spacing-2);
            margin-top: var(--spacing-6);
        }
        .page-btn {
            padding: var(--spacing-2) var(--spacing-4);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            background: var(--color-white);
            cursor: pointer;
        }
        .page-btn.active {
            background: var(--color-primary);
            color: var(--color-white);
            border-color: var(--color-primary);
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: var(--spacing-8);
            background: var(--color-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--color-gray-200);
        }
        .login-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-secondary);
            margin-bottom: var(--spacing-2);
            text-align: center;
        }
        .login-subtitle {
            color: var(--color-gray-500);
            text-align: center;
            margin-bottom: var(--spacing-8);
        }
        .form-group {
            margin-bottom: var(--spacing-5);
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-2);
            color: var(--color-secondary);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: var(--spacing-3) var(--spacing-4);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
        }
        input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-login {
            width: 100%;
            margin-top: var(--spacing-4);
        }
    </style>
</head>
<body>
    <div id="login-page" class="login-page">
        <div class="login-container">
            <h1 class="login-title">Admin Login</h1>
            <p class="login-subtitle">A2M Digital Solutions Admin Dashboard</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-login">Sign In</button>
            </form>
            <p id="login-error" style="color: var(--color-error); text-align: center; margin-top: var(--spacing-4); display: none;"></p>
        </div>

    <div id="admin-dashboard" class="admin-layout" style="display: none;">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="company_logo1.png" alt="A2M Logo" style="width: 32px; height: 32px; border-radius: var(--radius-md);">
                <span>A2M Admin</span>
            </div>
            <nav class="admin-nav">
                <a href="#" class="active" data-page="dashboard">Dashboard</a>
                <a href="#" data-page="inquiries">Inquiries</a>
                <a href="#" data-page="visitors">Visitors</a>
                <a href="#" id="logout-btn">Logout</a>
            </nav>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <h1 class="admin-title" id="page-title">Dashboard</h1>
                <span id="admin-user" style="color: var(--color-gray-500); font-size: var(--font-size-sm);"></span>
            </header>

            <!-- Dashboard Page -->
            <div id="page-dashboard">
                <div class="stats-grid">
                    <div class="stat-card primary">
                        <div class="stat-label">Total Inquiries</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">New</div>
                        <div class="stat-value" id="stat-new">0</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-label">Contacted</div>
                        <div class="stat-value" id="stat-contacted">0</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-label">Closed</div>
                        <div class="stat-value" id="stat-closed">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Visits</div>
                        <div class="stat-value" id="stat-total-visits">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Today's Visits</div>
                        <div class="stat-value" id="stat-today-visits">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Unique Visitors</div>
                        <div class="stat-value" id="stat-unique-visitors">0</div>
                    </div>
                    <div class="stat-card primary">
                        <div class="stat-label">Today's Visits</div>
                        <div class="stat-value" id="stat-today">0</div>
                    </div>
                </div>
            </div>

            <!-- Inquiries Page -->
            <div id="page-inquiries" style="display: none;">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inquiries-table"></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>

            <!-- Visitors Page -->
            <div id="page-visitors" style="display: none;">
                <div class="stats-grid" id="visitor-stats"></div>
            </div>
        </main>
    </div>

    <script>
        // Admin Dashboard Logic
        const API_BASE = '';
        let currentPage = 1;
        const perPage = 20;

        // DOM Elements
        const loginPage = document.getElementById('login-page');
        const adminDashboard = document.getElementById('admin-dashboard');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const adminUserEl = document.getElementById('admin-user');
        const pageTitle = document.getElementById('page-title');
        const navLinks = document.querySelectorAll('.admin-nav a[data-page]');
        const pages = document.querySelectorAll('[id^="page-"]');

        // Stats elements
        const statElements = {
            total: document.getElementById('stat-total'),
            new: document.getElementById('stat-new'),
            contacted: document.getElementById('stat-contacted'),
            closed: document.getElementById('stat-closed'),
            totalVisits: document.getElementById('stat-total-visits'),
            todayVisits: document.getElementById('stat-today-visits'),
            uniqueVisitors: document.getElementById('stat-unique-visitors'),
            today: document.getElementById('stat-today')
        };

        // Check for existing session
        async function checkAuth() {
            try {
                const res = await fetch('/admin/stats', {
                    credentials: 'include'
                });
                if (res.ok) {
                    showDashboard();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        async function showDashboard() {
            loginPage.style.display = 'none';
            adminDashboard.style.display = 'grid';
            await loadDashboard();
        }

        function showLogin() {
            adminDashboard.style.display = 'none';
            loginPage.style.display = 'flex';
        }

        // Login handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password }),
                    credentials: 'include'
                });

                if (res.ok) {
                    await showDashboard();
                } else {
                    loginError.textContent = 'Invalid credentials';
                    loginError.style.display = 'block';
                }
            } catch (e) {
                loginError.textContent = 'Login failed. Please try again.';
                loginError.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/admin/logout', { method: 'POST', credentials: 'include' });
            showLogin();
        });

        // Navigation
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                if (link.id === 'logout-btn') return;

                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                const page = link.dataset.page;
                pages.forEach(p => p.style.display = 'none');
                document.getElementById(`page-${page}`).style.display = 'block';
                document.getElementById('page-title').textContent = page.charAt(0).toUpperCase() + page.slice(1);

                if (page === 'dashboard') loadDashboard();
                else if (page === 'inquiries') loadInquiries(1);
                else if (page === 'visitors') loadVisitorStats();
            });
        });

        async function loadDashboard() {
            try {
                const [inquiryRes, visitorRes] = await Promise.all([
                    fetch('/admin/stats', { credentials: 'include' }),
                    fetch('/api/visitors', { credentials: 'include' })
                ]);

                const inquiryStats = await inquiryRes.json();
                const visitorStats = await visitorRes.json();

                statElements.total.textContent = inquiryStats.total;
                statElements.new.textContent = inquiryStats.new;
                statElements.contacted.textContent = inquiryStats.contacted;
                statElements.closed.textContent = inquiryStats.closed;

                statElements.totalVisits.textContent = visitorStats.total_visits.toLocaleString();
                statElements.todayVisits.textContent = visitorStats.today_visits.toLocaleString();
                statElements.uniqueVisitors.textContent = visitorStats.unique_visitors.toLocaleString();
                statElements.today.textContent = visitorStats.today_visits.toLocaleString();
            } catch (e) {
                console.error('Dashboard load error:', e);
            }
        }

        let currentInquiryPage = 1;
        const perPage = 20;

        async function loadInquiries(page = 1) {
            try {
                const res = await fetch(`/admin/inquiries?page=${page}&per_page=20`, {
                    credentials: 'include'
                });
                const data = await res.json();

                const tbody = document.getElementById('inquiries-table');
                tbody.innerHTML = data.inquiries.map(i => `
                    <tr>
                        <td>${i.id}</td>
                        <td>${i.name}</td>
                        <td>${i.email}</td>
                        <td>${i.service.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase())}</td>
                        <td><span class="badge badge-${i.status}">${i.status}</span></td>
                        <td>${new Date(i.created_at).toLocaleDateString()}</td>
                        <td>
                            <select onchange="updateStatus(${i.id}, this.value)" class="form-select" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ddd;">
                                <option value="new" ${i.status === 'new' ? 'selected' : ''}>New</option>
                                <option value="contacted" ${i.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="closed" ${i.status === 'closed' ? 'selected' : ''}>Closed</option>
                            </select>
                        </td>
                    `).join('');

                renderPagination(data.total, data.page, data.total_pages);
            } catch (e) {
                console.error('Load inquiries error:', e);
            }
        }

        async function updateStatus(id, status) {
            try {
                await fetch(`/admin/inquiries/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status }),
                    credentials: 'include'
                });
                loadInquiries(currentInquiryPage);
            } catch (e) {
                console.error('Update status error:', e);
            }
        }

        function renderPagination(total, page, totalPages) {
            const pagination = document.getElementById('pagination');
            let html = '';

            if (page > 1) {
                html += `<button class="page-btn" onclick="loadInquiries(${page - 1})">Previous</button>`;
            }

            for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadInquiries(${i})">${i}</button>`;
            }

            if (page < totalPages) {
                html += `<button class="page-btn" onclick="loadInquiries(${page + 1})">Next</button>`;
            }

            document.getElementById('pagination').innerHTML = html;
        }

        async function loadVisitorStats() {
            try {
                const res = await fetch('/api/visitors', { credentials: 'include' });
                const stats = await res.json();

                document.getElementById('visitor-stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Visits</div>
                        <div class="stat-value">${stats.total_visits.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Today's Visits</div>
                        <div class="stat-value">${stats.today_visits.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Unique Visitors</div>
                        <div class="stat-value">${stats.unique_visitors.toLocaleString()}</div>
                    </div>
                `;
            } catch (e) {
                console.error('Visitor stats error:', e);
            }
        }

        // Initialize
        (async () => {
            const authed = await checkAuth();
            if (!authed) showLogin();
        })();
    </script>
</body>
</html>
